version: "3.9"
services:
    web:
        build: .
        command:
            sh -c "python manage.py collectstatic --noinput &&
            gunicorn config.wsgi:application --bind 0.0.0.0:8000"
        volumes:
            - .:/app
            - static_volume:/app/staticfiles
        expose:
            - "8000"
        depends_on:
            - db
            - redis
        end_file:
            - ./.env

    nginx:
        build: .
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - static_volume:/app/staticfiles
        depends_on:
            - web

    db:
        image: postgres:17
        volumes:
            - postgres_data:/var/lib/postgresql/data
        env_file:
            - ./.env

        networks:
            - app_network

    redis:
        image: redis:7
        volumes:
            - redis_data:/data
        env_file:
            - ./.env

    celery:
        build:
            context: .
        container_name: celery_worker
        command:
            celery -A config worker -l INFO --pool=solo
        env_file:
            - ./.env
        volumes:
            - .:/app
        depends_on:
            - db
            - redis

    celery_beat:
        build:
            context: .
        container_name: celery_beat
        command:
            celery -A config beat --loglevel=INFO
        env_file:
            - ./.env
        volumes:
            - .:/app
        depends_on:
            - db
            - redis
            - celery



volumes:
    postgres_data:
    redis_data:
    static_volume: